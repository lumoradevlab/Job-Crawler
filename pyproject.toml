[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jobcrawler"
version = "0.1.0"
description = "Crawl remote Android/mobile developer jobs across every reachable board, US-only by default."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AshLey" }]
keywords = ["jobs", "crawler", "remote-work", "android", "job-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

# No runtime dependencies, deliberately: the crawler is Python 3 stdlib only,
# so it runs anywhere Python does with nothing to install or keep current.
dependencies = []

[project.urls]
Homepage = "https://github.com/lumoradevlab/Job-Crawler"
Issues = "https://github.com/lumoradevlab/Job-Crawler/issues"

[project.scripts]
jobcrawler = "jobcrawler.cli:main"

[tool.setuptools.packages.find]
include = ["jobcrawler*"]
